<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coach OS · Design refresh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Newsreader:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Caveat:wght@400;500;600;700&family=Bebas+Neue&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  html, body, #root {
    margin: 0; padding: 0; height: 100%;
    background: #ece9e3;
    font-family: 'Inter', system-ui, sans-serif;
    color: #1c1917;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  * { box-sizing: border-box; }
  /* Reduced-motion respect · kill breath, keep shape */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
  /* Breath pulse keyframes · slow, calm. */
  @keyframes ckBreathHalo {
    0%, 100% { transform: scale(0.92); opacity: 0.55; }
    50% { transform: scale(1.04); opacity: 0.9; }
  }
  @keyframes ckBreathMid {
    0%, 100% { transform: scale(0.86); opacity: 0.7; }
    50% { transform: scale(1.02); opacity: 1; }
  }
  @keyframes ckBreathCore {
    0%, 100% { transform: scale(0.92); }
    50% { transform: scale(1.06); }
  }
  @keyframes ckDot {
    0%, 80%, 100% { transform: scale(0.55); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  @keyframes ckCaret {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
  @keyframes ckSkel {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
